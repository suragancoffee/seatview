name: 기관 데이터 구조 확인
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-kspo.mjs
        env:
          KCISA_RENT_KEY: ${{ secrets.KCISA_RENT_KEY }}
          KCISA_LINK_KEY: ${{ secrets.KCISA_LINK_KEY }}
