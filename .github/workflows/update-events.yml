name: 공연 목록 갱신

on:
  schedule:
    - cron: '17 18 1 * *'   # 매달 2일 새벽 3시 17분(한국시간)
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공공데이터 받아서 data/events.json 만들기
        env:
          KCISA_KEY: ${{ secrets.KCISA_KEY }}
          KCISA_RENT_KEY: ${{ secrets.KCISA_RENT_KEY }}
        run: node scripts/update-events.mjs
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet data/events.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "공연 목록 자동 갱신 ($(date +%Y-%m-%d))"
          git push
